; ============================================================
; AutoRadmin 配置示例
; 用法：复制本文件为 config.ini，改好内容后运行 AutoRadmin.exe
; ============================================================

; Radmin Viewer 的安装目录，也可以直接写 Radmin.exe 的完整路径
; 支持环境变量，例如 %ProgramFiles(x86)%\Radmin Viewer 3
; 留空则自动探测常见安装位置
RADMINDIR=C:\Program Files (x86)\Radmin Viewer 3

; 主程序文件名，一般不用改
EXENAME=Radmin.exe

; 传给 Radmin Viewer 的命令行参数
; 常用：/connect:目标地址[:端口]  /through:中继服务器[:端口]  /fullstretch  /nocursor  /sendclipboard
ARGS=/connect:192.168.1.10:4899 /fullstretch

; 目标服务器的登录账号；两项都留空表示使用 Radmin 已保存的凭据
CONNECTUSER=your-username
CONNECTPASS=your-password

; 中继服务器（/through）的认证账号，不用中继可留空
THROUGHUSER=
THROUGHPASS=

; 登录窗口标题关键字，留空则用内置值（含中文版 Radmin 安全性）
; 若提示找不到登录窗口，用窗口探测工具查到标题后填在这里，填一段特征子串即可
WINDOWTITLE=

; 等待安全窗口出现的超时秒数
WAITTIMEOUT=15

; Radmin Viewer 已在运行时：continue=继续新建连接，exit=直接退出
IFRUNNING=continue

; 排查问题时设为 1，会在同目录生成 AutoRadmin.log 记录每一步
DEBUG=0
